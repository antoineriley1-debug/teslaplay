  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  async function decryptWithKey(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    return new TextDecoder().decode(plain);
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iters, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  function launch(html) {
    document.open();
    document.write(html);
    document.close();
  }
  (async () => {
    try {
      const saved = localStorage.getItem('tp.siteKey');
      if (saved) {
        const key = await crypto.subtle.importKey('raw', b64(saved), { name: 'AES-GCM' }, false, ['decrypt']);
        const html = await decryptWithKey(key);
        launch(html);
        return;
      }
    } catch { try { localStorage.removeItem('tp.siteKey'); } catch {} }
    document.getElementById('f').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      const pw = document.getElementById('pw').value;
      err.textContent = ''; btn.disabled = true; btn.textContent = 'Unlocking…';
      try {
        const key = await derive(pw);
        const html = await decryptWithKey(key);
        if (document.getElementById('rem').checked) {
          const raw = await crypto.subtle.exportKey('raw', key);
          try { localStorage.setItem('tp.siteKey', toB64(raw)); } catch {}
        }
        launch(html);
      } catch {
        err.textContent = 'Wrong password.';
        btn.disabled = false; btn.textContent = 'Unlock';
        document.getElementById('pw').select();
      }
    });
  })();
